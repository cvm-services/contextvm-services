<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator · devices</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8ecf3; --dim:#97a1b3;
          --ok:#35c48a; --warn:#e8b33a; --bad:#e5544b; --accent:#6aa8ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
  h1{font-size:17px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
  .dim{color:var(--dim)}
  button{font:inherit;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
    background:#1e2430;color:var(--fg);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08101f;font-weight:600}
  button.danger{color:var(--bad);border-color:#4c2523}
  input{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#10141b;color:var(--fg);width:100%}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:18px 0 8px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid #4a3c17;color:var(--warn)}
</style>
</head>
<body>
<h1>Devices</h1>
<div class="sub">Approving a device is what lets it act as a facilitator. Nothing secret is exchanged — the device has already proven it holds the key.</div>

<div id="auth" class="card" hidden>
  <div style="font-weight:600;margin-bottom:8px">Operator token</div>
  <input id="token" type="password" placeholder="operator token" autocomplete="off">
  <div style="margin-top:10px"><button class="primary" id="save">Connect</button></div>
  <div class="dim" id="err" style="color:var(--bad);margin-top:8px"></div>
</div>

<h2>Waiting for approval</h2>
<div id="pending"></div>
<div id="nopending" class="dim" hidden>Nothing waiting.</div>

<h2>Approved devices</h2>
<div id="approved"></div>
<div id="noapproved" class="dim" hidden>No devices approved yet.</div>

<script>
const API = window.__API__ || "";
let token = sessionStorage.getItem("cvm_admin") || "";
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (r.status === 401) { showAuth(); throw new Error("unauthorised"); }
  if (!r.ok) throw new Error(`${r.status}`);
  return r.status === 204 ? null : r.json();
}

function showAuth() { $("auth").hidden = false; $("pending").innerHTML = ""; $("approved").innerHTML = ""; }

function when(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

async function refresh() {
  if (!token) return showAuth();
  try {
    const data = await api("/admin/devices");
    $("auth").hidden = true;
    $("pending").innerHTML = "";
    $("approved").innerHTML = "";

    const pend = data.pending || [];
    $("nopending").hidden = pend.length > 0;
    for (const p of pend) {
      const c = el("div", "card");
      const row = el("div", "row");
      const left = el("div");
      left.appendChild(el("div", "mono", p.npub));
      // Attempt count matters: a device retrying every few seconds is a person
      // waiting, not an attack, but the difference is worth seeing.
      left.appendChild(el("div", "dim", `first seen ${when(p.first_seen)} · ${p.attempts} attempt${p.attempts > 1 ? "s" : ""}`));
      row.appendChild(left);
      const b = el("button", "primary", "Approve");
      b.onclick = async () => { await api(`/admin/devices/${p.npub}/approve`, { method: "POST" }); refresh(); };
      row.appendChild(b);
      c.appendChild(row);
      $("pending").appendChild(c);
    }

    const appr = data.approved || [];
    $("noapproved").hidden = appr.length > 0;
    for (const npub of appr) {
      const c = el("div", "card");
      const row = el("div", "row");
      row.appendChild(el("div", "mono", npub));
      const b = el("button", "danger", "Revoke");
      b.onclick = async () => {
        // Revoking kills live tokens too; say so before doing it.
        if (!confirm("Revoke this device? Any token it holds stops working immediately.")) return;
        await api(`/admin/devices/${npub}`, { method: "DELETE" });
        refresh();
      };
      row.appendChild(b);
      c.appendChild(row);
      $("approved").appendChild(c);
    }
  } catch { /* keep the last good view */ }
}

$("save").onclick = async () => {
  token = $("token").value.trim();
  sessionStorage.setItem("cvm_admin", token);
  $("err").textContent = "";
  try { await refresh(); } catch { $("err").textContent = "That token was not accepted."; }
};

if (token) refresh(); else showAuth();
setInterval(refresh, 5000);
</script>
</body>
</html>
