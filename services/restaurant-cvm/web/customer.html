<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order food</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8ecf3; --dim:#97a1b3;
    --ok:#35c48a; --warn:#e8b33a; --bad:#e5544b; --accent:#6aa8ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:96px}
  header{padding:16px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4}
  header h1{margin:0;font-size:17px;font-weight:650}
  header .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  main{padding:12px 16px;max-width:640px;margin:0 auto}
  .item{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item .n{font-weight:550}
  .item .p{color:var(--dim);font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:#1e2430;color:var(--fg);font-size:17px;cursor:pointer}
  .stepper .q{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
  footer{position:fixed;left:0;right:0;bottom:0;background:#0b0e13;border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
  .total{font-weight:650}
  .total small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
  button.primary{font:inherit;padding:12px 18px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:#08101f;font-weight:650;cursor:pointer}
  button.primary:disabled{opacity:.45;cursor:default}
  .sheet{position:fixed;inset:0;background:rgba(6,8,12,.82);display:none;z-index:10;overflow:auto}
  .sheet.open{display:block}
  .sheet .inner{background:var(--card);border:1px solid var(--line);border-radius:16px;
    max-width:520px;margin:40px auto;padding:18px}
  .inv{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;color:var(--dim);
    word-break:break-all;background:#10141b;border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0}
  .state{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:600}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warn{border:1px solid #4c2523;background:#241413;color:#ffb4ae;border-radius:10px;
    padding:11px 12px;font-size:13px;margin:12px 0}
  .ok{color:var(--ok)}
  .bad{color:var(--bad)}
  .hint{color:var(--dim);font-size:12.5px}
  .copy{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#1e2430;color:var(--fg);cursor:pointer}
  button.primary.wide{width:100%;margin:14px 0}
  details.selfpay{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  details.selfpay summary{cursor:pointer;color:var(--dim);font-size:12.5px}
  details.selfpay[open] summary{margin-bottom:8px}
  .locate{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 12px}
  .locate-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .locate button,.locate select,.locate input{font:inherit;font-size:12px;padding:8px 9px;border-radius:8px;
    border:1px solid var(--line);background:#1e2430;color:var(--fg)}
  .locate button{cursor:pointer}
  .locate input,.locate select{min-width:0;flex:1}
  .geo{color:var(--dim);font-size:11.5px;margin:7px 0 0;line-height:1.45}
  .geoerr{color:#ffb4ae}
  .venuegrid{display:flex;flex-direction:column;gap:9px}
  .venuecard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);cursor:pointer}
  .venuecard h2{font-size:15px;margin:0}
  .venuecard p{color:var(--dim);font-size:12px;margin:4px 0 0}
  .venuecard .tag{display:inline-block;margin-top:8px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--dim);font-size:11px}
  .backbar{border:0;background:transparent;color:var(--dim);cursor:pointer;font:inherit;padding:0 0 10px}
  .empty{color:var(--dim);font-size:13px;line-height:1.6;padding:18px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">Venues</h1>
  <div class="sub" id="subtitle">Choose a restaurant · pay with sats</div>
</header>

<main id="menu"></main>

<footer>
  <div class="bar">
    <div class="total">
      <span id="total">0 sats</span>
      <small id="count">empty basket</small>
    </div>
    <button class="primary" id="pay" disabled>Create order</button>
  </div>
</footer>

<div class="sheet" id="sheet">
  <div class="inner">
    <div style="font-weight:650;font-size:16px" id="sheetTitle">Pay your order</div>

    <div class="state" id="stateLine"><span class="spin"></span><span id="stateText">Waiting for payment…</span></div>

    <div id="warnBox" class="warn" hidden></div>

    <div class="inv" id="invoice">—</div>

    <details class="selfpay" id="selfpay" open>
      <summary>Pay with your Lightning wallet</summary>
      <div class="warn">
        Pay this invoice from your own wallet. The facilitator will place the
        order and confirm it here. The invoice is single-use.
      </div>
      <div style="display:flex;justify-content:center;margin:12px 0">
        <canvas id="qr" width="220" height="220" style="background:#fff;border-radius:10px;padding:8px"></canvas>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="copy" id="webln" hidden>Pay with browser wallet</button>
        <button class="copy" id="openwallet">Open in wallet</button>
        <button class="copy" id="copy">Copy invoice</button>
      </div>
    </details>

    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="copy" id="check">I've paid — check status</button>
      <button class="copy" id="closeSheet">Close</button>
    </div>
    <div class="hint" style="margin-top:12px" id="footHint"></div>
  </div>
</div>

<script type="module">
import { qrMatrix } from "./vendor/qr.js";

// The payment screen may only ever state what the server states. There is no
// optimistic "paid" here: a spinner while paying, and an explicit, loud
// "do not pay again" whenever the outcome is unknown - because a second payment
// is the one mistake the customer cannot undo.
const API = window.__API__ || "";
let basket = new Map();   // id -> qty
let order = null;
let poll = null;

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US") + " sats";

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let venues = [];
let venue = null;
let geo = null;
let radius = 10;
let geoStatus = "";
let geoBusy = false;
const CITY_CENTERS = {
  "Poznań": { lat: 52.4064, lon: 16.9252 },
  "Berlin": { lat: 52.5200, lon: 13.4050 },
  "Warszawa": { lat: 52.2297, lon: 21.0122 },
  "Kraków": { lat: 50.0647, lon: 19.9450 },
};
function venueLoc(v) {
  const l = v?.location;
  if (!l || !Number.isFinite(Number(l.lat)) || !Number.isFinite(Number(l.lon))) return null;
  return { lat: Number(l.lat), lon: Number(l.lon) };
}
function venueAddress(v) {
  const a = v?.address || {};
  return [a.street, [a.postal_code || a.zip, a.city].filter(Boolean).join(" ")]
    .filter(Boolean).join(", ") || (a.city || "Location unknown");
}
function distanceKm(a, b) {
  const R = 6371, rad = (n) => n * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const q = Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(q));
}
function visibleVenues() {
  let out = [...venues];
  const r = Number(radius) || 0;
  if (geo && r > 0) {
    out = out.map((v) => ({ v, loc: venueLoc(v) }))
      .filter((x) => x.loc && distanceKm(geo, x.loc) <= r)
      .sort((a, b) => distanceKm(geo, a.loc) - distanceKm(geo, b.loc))
      .map((x) => x.v);
  }
  return out;
}
function locationHtml() {
  const r = Number(radius) || 0;
  return `<div class="locate" aria-label="Venue location filter">
    <div class="locate-row">
      <button data-geo ${geoBusy ? "disabled" : ""}>⌖ ${geoBusy ? "Locating…" : "Use my location"}</button>
      <select data-city aria-label="City"><option value="">Choose city…</option>
        ${Object.keys(CITY_CENTERS).map((n) => `<option value="${esc(n)}" ${geo?.label === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
      <select data-radius aria-label="Radius">
        ${[5, 10, 25, 50, 100].map((n) => `<option value="${n}" ${r === n ? "selected" : ""}>${n} km</option>`).join("")}
        <option value="0" ${r === 0 ? "selected" : ""}>All</option>
      </select>
    </div>
    <div class="locate-row">
      <input data-coords inputmode="decimal" placeholder="or latitude, longitude" aria-label="Coordinates">
      <button data-manual>Set</button>
      ${geo ? '<button data-clear>Show all</button>' : ""}
    </div>
    <p class="geo">${geo ? `Near <b>${esc(geo.label || "your location")}</b> · ${r ? r + " km" : "all venues"} · straight-line distance` : "Location stays on this device. Use it or choose a city."}</p>
    ${geoStatus ? `<p class="geo geoerr">${esc(geoStatus)}</p>` : ""}
  </div>`;
}
function renderVenueList() {
  const root = $("menu");
  const list = visibleVenues();
  $("title").textContent = "Venues";
  $("subtitle").textContent = "Choose a restaurant · pay with sats";
  root.innerHTML = locationHtml() + (list.length
    ? `<div class="venuegrid">${list.map((v) => {
        const d = geo && venueLoc(v) ? distanceKm(geo, venueLoc(v)).toFixed(1) + " km" : "";
        return `<button class="venuecard" data-venue="${esc(v.venue_slug)}"><h2>${esc(v.name)}</h2><p>${esc(venueAddress(v))}</p><p>${v.items.length} items${d ? " · " + d : ""}</p><span class="tag">${venueLoc(v) ? "location known" : "location unknown"}</span></button>`;
      }).join("")}</div>`
    : `<p class="empty">No venues with a known location in this radius. Choose a larger radius or show all.</p>`);
  root.querySelector("[data-geo]")?.addEventListener("click", requestGeo);
  root.querySelector("[data-city]")?.addEventListener("change", (e) => useCity(e.target.value));
  root.querySelector("[data-radius]")?.addEventListener("change", (e) => { radius = Number(e.target.value); renderVenueList(); });
  root.querySelector("[data-manual]")?.addEventListener("click", () => useCoords(root.querySelector("[data-coords]")?.value));
  root.querySelector("[data-clear]")?.addEventListener("click", () => { geo = null; geoStatus = ""; renderVenueList(); });
  root.querySelectorAll("[data-venue]").forEach((b) => b.onclick = () => {
    venue = venues.find((v) => v.venue_slug === b.dataset.venue);
    basket.clear();
    renderItems();
  });
}
function renderItems() {
  const root = $("menu");
  $("title").textContent = venue?.name || "Menu";
  $("subtitle").textContent = `${venueAddress(venue)} · pay with sats`;
  root.innerHTML = venues.length > 1
    ? '<button class="backbar" data-back-venues>‹ All venues</button>' : "";
  root.querySelector("[data-back-venues]")?.addEventListener("click", () => { venue = null; renderVenueList(); });
  for (const it of venue?.items || []) {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<div><div class="n"></div><div class="p">${it.sats} sats</div></div>
      <div class="stepper"><button data-act="minus" aria-label="remove one">−</button>
      <span class="q">0</span><button data-act="plus" aria-label="add one">+</button></div>`;
    row.querySelector(".n").textContent = it.name;
    const q = row.querySelector(".q");
    row.querySelector('[data-act="plus"]').onclick = () => {
      basket.set(it.id, (basket.get(it.id) || 0) + 1); q.textContent = basket.get(it.id); render();
    };
    row.querySelector('[data-act="minus"]').onclick = () => {
      const n = (basket.get(it.id) || 0) - 1;
      if (n <= 0) basket.delete(it.id); else basket.set(it.id, n);
      q.textContent = basket.get(it.id) || 0; render();
    };
    root.appendChild(row);
  }
  window.__menu = venue?.items || [];
  render();
}
function requestGeo() {
  if (!("geolocation" in navigator)) {
    geoStatus = "This browser cannot provide a location. Choose a city or enter coordinates.";
    renderVenueList(); return;
  }
  geoBusy = true; geoStatus = ""; renderVenueList();
  navigator.geolocation.getCurrentPosition(
    (pos) => { geo = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: "your location" }; geoBusy = false; renderVenueList(); },
    (err) => { geoBusy = false; geoStatus = err.code === 1 ? "Location permission was denied. Choose a city or enter coordinates." : "Location is unavailable right now. Choose a city or enter coordinates."; renderVenueList(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 },
  );
}
function useCity(name) {
  const center = CITY_CENTERS[name];
  if (!center) return;
  geo = { ...center, label: name }; geoStatus = ""; renderVenueList();
}
function useCoords(raw) {
  const m = String(raw || "").trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  const lat = m ? Number(m[1]) : NaN, lon = m ? Number(m[2]) : NaN;
  if (!m || !Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
    geoStatus = "Enter latitude, longitude (for example 52.4064, 16.9252).";
    renderVenueList(); return;
  }
  geo = { lat, lon, label: "my coordinates" }; geoStatus = ""; renderVenueList();
}
async function loadVenues() {
  let data;
  try {
    const r = await fetch(API + "/venues");
    if (r.ok) data = await r.json();
    else throw new Error("venues unavailable");
  } catch {
    const r = await fetch(API + "/menu");
    data = await r.json();
    if (data.items) data = { venues: [{ venue_slug: "three-buddies", name: data.venue || "Three Buddies", address: null, location: null, items: data.items }] };
  }
  venues = data.venues || [];
  if (venues.length === 1) { venue = venues[0]; renderItems(); }
  else renderVenueList();
}

function render() {
  const items = window.__menu || [];
  let total = 0, count = 0;
  for (const [id, qty] of basket) {
    const it = items.find((x) => x.id === id);
    if (it) { total += it.sats * qty; count += qty; }
  }
  $("total").textContent = fmt(total);
  $("count").textContent = count ? `${count} item${count > 1 ? "s" : ""}` : "empty basket";
  $("pay").disabled = count === 0;
}

function setState(kind, text, warnHtml) {
  $("stateLine").innerHTML =
    kind === "idle" ? `<span class="spin"></span><span id="stateText"></span>`
    : kind === "ready" ? `<span class="ok">●</span><span id="stateText"></span>`
    : kind === "ok" ? `<span class="ok">✓</span><span id="stateText" class="ok"></span>`
    : kind === "bad" ? `<span class="bad">✕</span><span id="stateText" class="bad"></span>`
    : `<span class="spin"></span><span id="stateText"></span>`;
  $("stateText").textContent = text;
  const w = $("warnBox");
  if (warnHtml) { w.hidden = false; w.innerHTML = warnHtml; } else { w.hidden = true; w.innerHTML = ""; }
}

function priceHint() {
  if (!order) return "";
  const est = order.estimate_sats;
  return est && est !== order.sats
    ? `Final price ${fmt(order.sats)} — the menu estimated ${fmt(est)}`
    : `Total ${fmt(order.sats)}`;
}

function applyState(s) {
  // Single source of truth: the server's state string.
  if (s.state === "paid") {
    // PAID IS NOT CONFIRMED. If the venue has not acknowledged yet, keep polling:
    // stopping here was a real bug - the screen said "paid" forever and never
    // learned that the restaurant accepted (or rejected) the order.
    if (s.venue_ref) {
      setState("ok", "Paid — the restaurant confirmed your order.");
      $("footHint").textContent = `Venue reference ${s.venue_ref}`;
      stopPoll();
    } else {
      setState("idle", "Paid — confirming with the restaurant…");
      $("footHint").textContent = "Waiting for the venue to accept the order.";
    }
  } else if (s.state === "outcome_unknown" || s.state === "paying") {
    setState("idle", "We are checking your payment…",
      "<b>Do not pay again.</b> Your payment may have gone through. " +
      "Paying a second invoice would charge you twice — we will resolve this before anything else.");
    $("footHint").textContent = "This can take a minute. Leave this screen open.";
  } else if (s.state === "failed") {
    setState("bad", "That payment did not go through.",
      "It is safe to try again — the network did not accept the payment.");
    $("footHint").textContent = priceHint();
  } else if (s.state === "refunded") {
    setState("bad", "Refunded.", "You have been made whole.");
    stopPoll();
  } else if (s.state === "invoiced") {
    setState("ready", "Invoice ready — pay with your Lightning wallet.");
    $("selfpay").open = true;
    $("footHint").textContent = priceHint();
  } else if (s.state === "created") {
    setState("idle", "Creating your invoice…");
    $("footHint").textContent = "";
  } else {
    setState("idle", "Waiting for payment…");
    $("footHint").textContent = priceHint();
  }
}

function stopPoll() { if (poll) { clearInterval(poll); poll = null; } }

async function startOrder() {
  $("sheet").classList.add("open");
  order = null;
  setState("idle", "Creating your invoice…");
  $("invoice").textContent = "—";
  $("footHint").textContent = "";
  $("selfpay").open = true;
  const items = [...basket].map(([id, qty]) => ({ id, qty }));
  const r = await fetch(API + "/orders", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ venue_slug: venue?.venue_slug, items }),
  });
  const after = await r.json().catch(() => ({}));
  if (!r.ok) {
    setState("bad", "Could not create the order.");
    const w = $("warnBox");
    w.hidden = false;
    w.textContent = after.detail
      ? `Reason: ${after.detail}`
      : (after.error ? `Error: ${after.error}` : `HTTP ${r.status}`);
    return;
  }
  order = after;
  if (!order.bolt11) {
    setState("bad", "The rail returned no invoice.");
    return;
  }
  $("invoice").textContent = order.bolt11;
  drawQr(order.bolt11);
  applyState({ state: "invoiced" });
  $("footHint").textContent = priceHint();

  stopPoll();
  poll = setInterval(refresh, 2000);
}

async function refresh() {
  if (!order) return;
  try {
    const r = await fetch(`${API}/orders/${order.order_id}`);
    if (r.ok) {
      const data = await r.json();
      order = { ...order, ...data };
      applyState(order);
    }
  } catch { /* keep the last honest state */ }
}

/** Draw the BOLT11 as a QR. A customer with a wallet app cannot type 200+ chars. */
function drawQr(text) {
  try {
    const { size, rows } = qrMatrix(text.toUpperCase(), "M");
    const c = $("qr");
    const ctx = c.getContext("2d");
    const px = Math.floor(c.width / (size + 2));
    const off = Math.floor((c.width - px * size) / 2);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#000";
    for (let r = 0; r < size; r++) {
      for (let col = 0; col < size; col++) {
        if (rows[r][col]) ctx.fillRect(off + col * px, off + r * px, px, px);
      }
    }
  } catch (e) {
    // A QR failure must not stop the invoice from being payable by copy/paste.
    console.error("qr render failed", e);
  }
}

// WebLN (Alby, browser extensions): one tap, and the wallet reports its own result.
// We still poll the server afterwards - the wallet saying "sent" is not the rail
// saying "settled", and only the rail decides what the customer is told.
$("webln").onclick = async () => {
  try {
    await window.webln.enable();
    await window.webln.sendPayment(order.bolt11);
    $("footHint").textContent = "Wallet reports sent — confirming with the network…";
  } catch (e) {
    $("footHint").textContent = "The wallet did not send it. The invoice is still valid.";
  }
};

if (window.webln) $("webln").hidden = false;

$("openwallet").onclick = () => {
  // lightning: links are handled by the OS wallet chooser on mobile.
  location.href = `lightning:${order?.bolt11 ?? ""}`;
};

let checking = false;
async function checkStatus() {
  if (!order || checking) return;
  checking = true;
  $("check").disabled = true;
  $("footHint").textContent = "Checking the payment…";
  try {
    const r = await fetch(`${API}/orders/${order.order_id}/check`, { method: "POST" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || body.error || `HTTP ${r.status}`);
    applyState(body);
  } catch (e) {
    $("footHint").textContent = `Check failed: ${e.message || e}`;
  } finally {
    setTimeout(() => { checking = false; $("check").disabled = false; }, 3000);
  }
}

$("check").onclick = checkStatus;
$("pay").onclick = startOrder;
$("closeSheet").onclick = () => { $("sheet").classList.remove("open"); stopPoll(); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("invoice").textContent); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Select and copy"; }
};

loadVenues().catch((e) => {
  $("menu").innerHTML = `<p class="empty">Could not load venues: ${esc(e.message || e)}</p>`;
});
</script>
</body>
</html>
