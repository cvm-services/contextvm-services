name: ci

# ngit CI (Nostr) runs .ngit/act/workflows/ ONLY; .github/workflows/ is never
# executed by the coordinator. This file runs the checks the repo declares in
# deno.json, so the two cannot drift apart.
#
# The venue catalogue has ONE independent verification anchor that is not
# derived from the served record: `venues/tools/capture_menu.py --check` rebuilds
# every capture-menu venue from its COMMITTED evidence and fails on any drift.
# It was passing locally but was wired into no lane, so a record could change —
# or a fake one could appear — with every lane green. It runs here now.
# `venues/anchors.json` is the committed expectation the tests and the e2e
# client compare the live reply against; `deno task test` covers it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.0
      # `deno task check` = deno check tools/emit-venue-announcement.ts
      - run: deno task check
      # `deno task test`  = deno test --allow-read
      # (includes the committed-anchor checks: coverage, drift guard, live reply
      #  vs anchor, and evidence-on-disk for every served venue)
      - run: deno task test
      # `deno task anchors` = the committed anchor matches the venue records
      - run: deno task anchors
      # `deno task venues:check` = every venues/*/venue.json rebuilt from its
      # committed evidence (evidence/raw/page.txt) must be byte-identical
      - run: deno task venues:check

  # Two runners, and until now CI ran only one of them. 14 files import
  # `bun:test`; deno cannot load them, so they were excluded from `deno task test`
  # and nothing ran them at all. A suite nobody runs is worse than a missing one:
  # it looks like coverage.
  bun:
    name: bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Tag, not a pinned SHA: the other actions here are hash-pinned and I could
      # not verify setup-bun's real commit, and an invented SHA is worse than an
      # honest tag - it silently resolves to nothing and fails at fetch time.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install step: these suites import only `bun:test`, which ships with the
      # runtime. Anything that grows a real dependency must add a lockfile here.
      # Glob covers BOTH naming styles: 12 files use *.test.ts, 2 use *_test.ts.
      # Selecting only *.test.ts would leave those two unrun - the exact problem
      # this job exists to fix.
      - run: bun test $(grep -rl 'from "bun:test"' --include='*.ts' services | grep -v node_modules)
