name: ci

# ngit CI (Nostr) runs .ngit/act/workflows/ ONLY; .github/workflows/ is never
# executed by the coordinator. This file runs the checks the repo declares in
# deno.json, so the two cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.0
      # `deno task check` = deno check tools/emit-venue-announcement.ts
      - run: deno task check
      # `deno task test`  = deno test --allow-read  (81 passed / 0 failed / 1 ignored)
      - run: deno task test
